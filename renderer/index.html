<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Pear Snake</title>
    <style>
      #titlebar {
        -webkit-app-region: drag;
        height: 30px;
        width: 100%;
        position: fixed;
        left: 0;
        top: 0;
        background-color: #b0d94413;
        filter: drop-shadow(2px 10px 6px #888);
      }

      button,
      input {
        all: unset;
        border: 1px solid #b0d944;
        background: #000;
        color: #b0d944;
        padding: 0.45rem;
        font-family: monospace;
        font-size: 1rem;
        line-height: 1rem;
      }

      button {
        cursor: pointer;
      }

      button:hover {
        background: rgba(176, 217, 68, 0.15);
      }

      button:active {
        background: #b0d944;
        color: #001601;
      }

      button:disabled {
        opacity: 0.35;
        cursor: default;
      }

      input::placeholder {
        color: #6f8a2e;
      }

      body {
        background-color: #001601;
        font-family: monospace;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }

      main {
        display: flex;
        height: 100vh;
        align-items: center;
        justify-content: center;
        padding: 0;
        color: white;
      }

      .hidden {
        display: none !important;
      }

      #setup {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      #title-row {
        display: flex;
        align-items: center;
        margin-bottom: 40px;
      }

      #title-row img {
        width: 34px;
        height: 46px;
        margin-right: 12px;
        object-fit: contain;
      }

      #title-row span {
        color: #b0d944;
        font-size: 40px;
      }

      #or {
        margin: 1.5rem auto;
      }

      #loading {
        align-self: center;
      }

      #game,
      #details {
        background: #000;
        border: 1px solid #b0d944;
      }

      #game-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 0.5em;
      }

      #leave-game {
        border: none;
        padding: 0.2rem;
      }

      #leave-game:hover,
      #leave-game:active {
        background: transparent;
        color: #b0d944;
        opacity: 0.7;
      }

      #score-line {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: flex-end;
        color: #b0d944;
        font-size: 1rem;
      }

      .chip {
        display: inline-flex;
        align-items: center;
        border: 1px solid rgba(176, 217, 68, 0.3);
        background: #000;
        padding: 3px 6px;
        margin: 2px;
        color: #fff;
        font-size: 12px;
      }

      .chip.me {
        border-color: #b0d944;
      }

      .chip.more {
        border-color: rgba(176, 217, 68, 0.2);
        color: #b0d944;
        opacity: 0.7;
      }

      .swatch {
        width: 10px;
        height: 10px;
        margin-right: 4px;
        border: 1px solid rgba(255, 255, 255, 0.35);
      }

      #board-wrap {
        position: relative;
      }

      #game-over {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.6);
      }

      #game-over-title {
        color: #b0d944;
        font-size: 32px;
        margin-bottom: 20px;
      }

      #final-score {
        color: #b0d944;
        font-size: 18px;
        margin-bottom: 20px;
      }

      #details {
        padding: 0.5em;
        line-height: 1.5em;
        color: #b0d944;
      }

      pear-snake {
        display: block;
        text-align: center;
      }

      #update-banner {
        position: fixed;
        top: 30px;
        left: 0;
        right: 0;
        background: #b0d944;
        color: #001601;
        text-align: center;
        padding: 0.5rem;
        font-family: monospace;
        z-index: 10;
      }

      #update-banner button {
        margin-left: 12px;
        padding: 4px 10px;
        background: transparent;
        border-color: #001601;
        color: #001601;
      }

      #update-banner button:hover {
        background: rgba(0, 22, 1, 0.1);
      }

      #update-banner button:active,
      #update-banner button:disabled {
        background: transparent;
        color: #001601;
        opacity: 0.6;
      }
    </style>
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <div id="titlebar"></div>
    <div id="update-banner" class="hidden"></div>
    <main>
      <div id="setup">
        <div id="title-row">
          <img src="../assets/pear.png" alt="" />
          <span>Snake</span>
        </div>
        <div>
          <button id="create-game">Create</button>
        </div>
        <div id="or">- or -</div>
        <form id="join-form">
          <button type="submit" id="join-game">Join</button>
          <input
            required
            id="join-game-topic"
            type="text"
            placeholder="Game Topic"
            pattern="[0-9a-fA-F]{64}"
            title="64-character game topic (hex)"
          />
        </form>
      </div>
      <div id="loading" class="hidden">Loading ...</div>

      <div id="game" class="hidden">
        <div id="game-header">
          <button id="leave-game">&lsaquo; Leave</button>
          <div id="score-line"></div>
        </div>
        <div id="board-wrap">
          <pear-snake></pear-snake>
          <div id="game-over" class="hidden">
            <div id="game-over-title">Game Over</div>
            <div id="final-score"></div>
            <button id="play-again">Play again</button>
          </div>
        </div>
        <div id="details">
          <div>Topic: <span id="game-topic"></span></div>
          <div>Peers: <span id="peers-count">0</span></div>
        </div>
      </div>
    </main>
  </body>
</html>
